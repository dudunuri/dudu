<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בוחן מקיף: ניווט, טופוגרפיה ופענוח תצ"א</title>
    <!-- CSS & JS External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.4.7/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-dark: #0a0f0d;
            --panel-bg: rgba(18, 28, 22, 0.9);
            --border-color: #2a4735;
            --accent-green: #00ff66;
            --accent-gold: #ffd700;
            --text-main: #e0f0e5;
            --text-muted: #8ba895;
            
            --btn-red: #d32f2f;
            --btn-blue: #1976d2;
            --btn-yellow: #f57c00;
            --btn-green: #388e3c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Topo Map Background Pattern */
        #topo-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            opacity: 0.15;
            pointer-events: none;
        }

        .screen {
            display: none;
            width: 90%;
            max-width: 1000px;
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.1);
            backdrop-filter: blur(8px);
            text-align: center;
            animation: fadeIn 0.4s ease-out;
        }

        .screen.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h1, h2, h3 { color: #fff; text-shadow: 0 0 10px rgba(0, 255, 102, 0.3); margin-bottom: 1rem; }
        p { color: var(--text-muted); margin-bottom: 1.5rem; font-size: 1.1rem; }

        /* General Buttons */
        .btn {
            background: linear-gradient(135deg, #1b3826, #0e2115);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            padding: 1rem 2rem;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 0.5rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .btn:hover {
            background: var(--accent-green);
            color: #000;
            box-shadow: 0 0 15px var(--accent-green);
            transform: translateY(-2px);
        }

        /* Mode Selection Box */
        .mode-container {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

        .mode-card {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            width: 280px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-card:hover {
            border-color: var(--accent-green);
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
        }

        /* Host Screen UI */
        .lobby-header {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(0,0,0,0.5);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
        }

        #qr-code { background: #fff; padding: 10px; border-radius: 8px; display: inline-block; }

        .player-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 1.5rem 0;
            min-height: 100px;
        }

        .player-chip {
            background: rgba(0, 255, 102, 0.15);
            border: 1px solid var(--accent-green);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

            background: rgba(0, 255, 102, 0.4);
            border: 2px solid #00ff66;
            box-shadow: 0 0
