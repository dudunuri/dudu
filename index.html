<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>בוחן מקיף: ניווט, טופוגרפיה ותצ"א</title>
    <!-- PeerJS Realtime Connection -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.4.7/peerjs.min.js"></script>

    <style>
        :root {
            --bg-dark: #0a0f0d;
            --panel-bg: rgba(18, 28, 22, 0.95);
            --border-color: #2a4735;
            --accent-green: #00ff66;
            --accent-gold: #ffd700;
            --text-main: #e0f0e5;
            --text-muted: #8ba895;
            
            --btn-red: #d32f2f;
            --btn-blue: #1976d2;
            --btn-yellow: #f57c00;
            --btn-green: #388e3c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 1100px;
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 1.2rem;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.15);
        }

        .screen.active { display: block; }

        h1 { font-size: 1.6rem; color: #fff; margin-bottom: 0.8rem; }
        h2 { font-size: 1.3rem; color: #fff; margin-bottom: 0.8rem; }
        p { color: var(--text-muted); font-size: 1rem; margin-bottom: 1rem; }

        .btn {
            background: linear-gradient(135deg, #1b3826, #0e2115);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            padding: 0.8rem 1.5rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 0.4rem;
            transition: all 0.2s;
        }

        .btn:hover { background: var(--accent-green); color: #000; box-shadow: 0 0 15px var(--accent-green); }

        /* Host Layout Split (Question + Side Leaderboard) */
        .host-main-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 1.2rem;
            align-items: start;
        }

        @media (max-width: 800px) {
            .host-main-layout { grid-template-columns: 1fr; }
        }

        .side-leaderboard {
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            text-align: right;
        }

        .side-lb-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem;
            margin-bottom: 0.4rem;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: bold;
        }

        .side-lb-item:nth-child(1) { color: var(--accent-gold); border-right: 3px solid var(--accent-gold); }

        /* Mobile Responsive Area */
        .mobile-card {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
            text-align: right;
        }

        .mobile-opt-btn {
            width: 100%;
            border: none;
            border-radius: 8px;
            color: #fff;
            padding: 1rem;
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 0.6rem;
            text-align: right;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
        }

        .opt-a { background: var(--btn-red); }
        .opt-b { background: var(--btn-blue); }
        .opt-c { background: var(--btn-yellow); }
        .opt-d { background: var(--btn-green); }

        .timer-container {
            width: 100%;
            height: 10px;
            background: #1a1a1a;
            border-radius: 5px;
            overflow: hidden;
            margin: 0.8rem 0;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: var(--accent-green);
            transition: width 1s linear;
        }

        .host-options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            margin: 1rem 0;
        }

        .host-option {
            padding: 0.8rem;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            text-align: right;
            color: #fff;
            display: flex;
            justify-content: space-between;
        }

        .correct-answer { border: 2px solid #fff; box-shadow: 0 0 10px #fff; }

        .player-chip {
            background: rgba(0, 255, 102, 0.2);
            border: 1px solid var(--accent-green);
            padding: 4px 10px;
            border-radius: 12px;
            display: inline-block;
            margin: 3px;
            font-size: 0.85rem;
            color: #fff;
        }

        .input-field {
            width: 100%;
            padding: 0.9rem;
            font-size: 1.1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #000;
            color: #fff;
            margin-bottom: 0.8rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Top Bar Controls -->
    <div style="position: absolute; top: 10px; left: 10px; z-index: 10;">
        <button id="sound-toggle" class="btn" style="padding: 4px 10px; font-size: 0.85rem;">🔊 צלילים: פעילים</button>
    </div>

    <!-- Screen 1: Role Selection -->
    <div id="screen-select" class="screen active">
        <h1>בוחן מקיף: ניווט, טופוגרפיה ותצ"א</h1>
        <p>בחר את התפקיד להתחלת המשחק</p>
        <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
            <div style="background: rgba(0,0,0,0.4); border: 1px solid var(--border-color); border-radius: 8px; padding: 1.5rem; width: 260px; cursor: pointer;" onclick="initHost()">
                <h2>📺 מציג (Host)</h2>
                <p>עבור המסך הראשי / טלוויזיה בכיתה</p>
            </div>
            <div style="background: rgba(0,0,0,0.4); border: 1px solid var(--border-color); border-radius: 8px; padding: 1.5rem; width: 260px; cursor: pointer;" onclick="showScreen('screen-join')">
                <h2>📱 צוער (Player)</h2>
                <p>עבור הסמארטפון האישי</p>
            </div>
        </div>
    </div>

    <!-- Screen 2: Join Screen -->
    <div id="screen-join" class="screen">
        <h2>הצטרפות למשחק</h2>
        <input type="text" id="game-pin-input" class="input-field" placeholder="הזן קוד משחק (PIN)">
        <input type="text" id="player-name-input" class="input-field" placeholder="שם הצוער / צוות">
        <button class="btn" onclick="joinGame()">התחבר למשחק</button>
    </div>

    <!-- Screen 3: Mobile Game UI -->
    <div id="screen-mobile-game" class="screen">
        <h3 id="mobile-status">ממתין לתחילת השאלה...</h3>
        <div id="mobile-question-area" style="display: none;">
            <div class="mobile-card">
                <h4 id="mobile-q-num" style="color: var(--accent-gold); margin-bottom: 0.4rem;"></h4>
                <p id="mobile-q-text" style="color: #fff; font-weight: bold; margin: 0; font-size: 1.1rem;"></p>
            </div>
            <button class="mobile-opt-btn opt-a" onclick="sendAnswer('א')"><span>▲</span> <span id="m-opt-a"></span></button>
            <button class="mobile-opt-btn opt-b" onclick="sendAnswer('ב')"><span>◆</span> <span id="m-opt-b"></span></button>
            <button class="mobile-opt-btn opt-c" onclick="sendAnswer('ג')"><span>●</span> <span id="m-opt-c"></span></button>
            <button class="mobile-opt-btn opt-d" onclick="sendAnswer('ד')"><span>■</span> <span id="m-opt-d"></span></button>
        </div>
        <div id="mobile-feedback" style="display: none; margin-top: 1.5rem;">
            <h1 id="feedback-text"></h1>
            <p id="feedback-score" style="font-size: 1.2rem; margin-top: 0.8rem;"></p>
        </div>
    </div>

    <!-- Screen 4: Host Lobby -->
    <div id="screen-host-lobby" class="screen">
        <h2>לובי מציג</h2>
        <h3>קוד משחק (PIN): <span id="host-pin-display" style="color: var(--accent-green); font-size: 2.2rem;">------</span></h3>
        <p>הצוערים נכנסים לקישור ומזינים את הקוד</p>
        <h3>צוערים שהתחברו (<span id="player-count">0</span>):</h3>
        <div id="player-list" style="min-height: 60px; margin: 1rem 0;"></div>
        <button class="btn" onclick="startQuiz()" style="font-size: 1.2rem;">התחל משחק 🚀</button>
    </div>

    <!-- Screen 5: Host Question View (With Side Leaderboard) -->
    <div id="screen-host-question" class="screen">
        <div class="host-main-layout">
            
            <!-- Permanent Side Leaderboard -->
            <div class="side-leaderboard">
                <h3 style="color: var(--accent-
