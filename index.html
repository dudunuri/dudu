<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>בוחן מקיף: ניווט, טופוגרפיה ותצ"א</title>
    <!-- PeerJS for Realtime Peer-to-Peer Communication -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.4.7/peerjs.min.js"></script>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #050b08 0%, #0d1a14 50%, #050806 100%);
            --panel-bg: rgba(15, 25, 20, 0.75);
            --panel-border: rgba(0, 255, 102, 0.2);
            --accent-green: #00ff66;
            --accent-green-glow: rgba(0, 255, 102, 0.4);
            --accent-gold: #ffcc00;
            --text-main: #f0f8f4;
            --text-muted: #9ab3a5;
            
            --btn-a: linear-gradient(135deg, #e53935, #b71c1c);
            --btn-b: linear-gradient(135deg, #1e88e5, #0d47a1);
            --btn-c: linear-gradient(135deg, #fb8c00, #e65100);
            --btn-d: linear-gradient(135deg, #43a047, #1b5e20);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow-x: hidden;
        }

        /* Modern Glassmorphism Cards */
        .screen {
            display: none;
            width: 100%;
            max-width: 1050px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 255, 102, 0.05);
            animation: fadeIn 0.3s ease-out;
        }

        .screen.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 0.5rem; text-shadow: 0 0 20px var(--accent-green-glow); }
        h2 { font-size: 1.4rem; font-weight: 700; margin-bottom: 1rem; }
        p { color: var(--text-muted); font-size: 1.05rem; margin-bottom: 1.5rem; }

        /* Buttons & Inputs */
        .btn-action {
            background: linear-gradient(135deg, #00ff66, #00b347);
            border: none;
            color: #021a0d;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 255, 102, 0.3);
            transition: all 0.2s ease;
            width: 100%;
            max-width: 300px;
        }

        .btn-action:active { transform: scale(0.97); }

        .input-field {
            width: 100%;
            max-width: 400px;
            padding: 1.1rem;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            border: 1px solid var(--panel-border);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            margin-bottom: 1.2rem;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus { border-color: var(--accent-green); box-shadow: 0 0 15px var(--accent-green-glow); }

        /* Mode Selection Cards */
        .mode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .mode-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2rem 1.5rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mode-card:hover {
            border-color: var(--accent-green);
            transform: translateY(-5px);
            background: rgba(0, 255, 102, 0.05);
            box-shadow: 0 10px 30px rgba(0, 255, 102, 0.15);
        }

        /* Layout Split for Host (Side Leaderboard + Main View) */
        .host-split {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 1.5rem;
            text-align: right;
        }

        @media (max-width: 850px) {
            .host-split { grid-template-columns: 1fr; }
        }

        .side-lb {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 1.2rem;
        }

        .side-lb-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.7rem 0.9rem;
            margin-bottom: 0.5rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .side-lb-item:nth-child(1) { border-right: 4px solid var(--accent-gold); color: var(--accent-gold); }

        /* Host Grid Options */
        .host-options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 1.2rem 0;
        }

        .host-opt {
            padding: 1.1rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .opt-a { background: var(--btn-a); }
        .opt-b { background: var(--btn-b); }
        .opt-c { background: var(--btn-c); }
        .opt-d { background: var(--btn-d); }

        .correct-highlight { border: 3px solid #fff; box-shadow: 0 0 25px #fff; transform: scale(1.02); }

        /* Timer Bar */
        .timer-track {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
            margin: 1rem 0;
        }

        .timer-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--accent-green), var(--accent-gold), #ff3333);
            transition: width 1s linear;
        }

        /* Mobile Player Layout */
        .mobile-opt-btn {
            width: 100%;
            border: none;
            border-radius: 14px;
            color: #fff;
            padding: 1.2rem 1.5rem;
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 0.9rem;
            text-align: right;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: transform 0.1s;
        }

        .mobile-opt-btn:active { transform: scale(0.96); }

        .badge-chip {
            background: rgba(0, 255, 102, 0.15);
            border: 1px solid var(--accent-green);
